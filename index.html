<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease;
            box-shadow: 0 10px 24px var(--shadow-color, rgba(0,0,0,.3));
        }
        .cube::after{
            content: "hover";
            opacity: 0;
            transition: opacity .3s ease;
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px var(--shadow-color, rgba(0,0,0,.3));
        }
        .cube:hover::after{
            opacity: 1;
        }

        .c1{
            border-radius: 0;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            --shadow-color: rgba(255, 94, 98, .35);
        }
        .c2{
            border-radius: 24px;
            background: linear-gradient(135deg,#43e97b,#38f9d7);
            --shadow-color: rgba(56, 249, 215, .35);
        }
        .c3{
            border-radius: 24px;
            background: linear-gradient(135deg,#b06ab3,#4568dc);
            --shadow-color: rgba(176, 106, 179, .35);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#f9d423,#ff4e50);
            --shadow-color: rgba(255, 78, 80, .35);
        }
        .c5{
            border-radius: 24px;
            background: linear-gradient(135deg,#0f9b8e,#2b5876);
            --shadow-color: rgba(15, 155, 142, .35);
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg,#a18cd1,#fbc2eb);
            --shadow-color: rgba(161, 140, 209, .35);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
